<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Wordle</title></head>
<body>
<script>
	var route = location.pathname.startsWith("/wordle/") ? location.pathname.slice("/wordle".length) : "/";
	location.replace("/wordle/#" + route + location.search + location.hash);
</script>
<a href="/wordle/">Open Wordle</a>
</body>
</html>
